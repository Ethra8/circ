{% extends "base.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block page_header%}
<div class="container header-container d-none">
    <div class="row">
        <div class="col"></div>
    </div>
</div>
{% endblock %}


{% block content %}
<div class="overlay"></div>
<div id="bag" class="container h-100 w-100">
    <div class="row h-100">
        <div class="col-12 col-lg-7 my-auto ml-md-0 mr-md-0 px-0">
            <div class="my-auto">
                <h1 class="eg-font mb-3 text-uppercase">
                  Contacta con Tak Tik Circ
                </h1>    
            </div>  
            <hr>
        </div>
        <div class="col-12 col-lg-7 contact-form pt-4">
            <form method="POST">
                {% csrf_token %}
                {% crispy form form.helper %}
            </form>
        </div>
    </div>
</div>
{% endblock %}
