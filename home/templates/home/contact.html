{% extends "base.html" %}
{% load static i18n %}
{% load crispy_forms_tags %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'home/css/home.css' %}">
{% endblock %}

{% block content %}
<div id="contact" class="container h-100 w-100">
<div class="overlay-shadow"></div>
    <div class="h-100">
        <div class="my-auto ml-md-0 mr-md-0 px-0">
            <div class="my-auto">
                <h1 class="mb-3">
                  No dudes en contactarnos!
                </h1>    
                <p>Respondemos en 24 - 48 horas.</p>
            </div>  
            <hr>
        </div>
        <div class="contact-form pt-4">
            <form method="POST">
                {% csrf_token %}
                {% crispy form form.helper %}
            </form>
        </div>
    </div>
</div>
{% endblock %}
