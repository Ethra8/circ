{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'home/css/home.css' %}">
{% endblock %}

{% block content %}
<div></div>
<div id="gallery" class="container h-100 w-100">

    <div class="my-auto ml-md-0 mr-md-0 px-0">
        <div class="my-auto">
            <h1 class="display-4">
                Galeria</span>
            </h1>    
        </div>
        <div class="my-5">
            <div class="row">
                <div class="gallery-container">
                    {% for item in images %}
                        <div class="gallery-item">
                            <img src="{{ item.image.url }}" alt="{{ item.alt_text|default:item.title }}">
                            <!-- {% if item.caption %}
                                <p>{{ item.caption }}</p>
                            {% endif %} -->
                        </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
