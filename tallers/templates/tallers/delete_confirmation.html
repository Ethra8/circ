{% extends "base.html" %}
{% load static i18n %}


{% block extra_css %}
<link rel="stylesheet" href="{% static 'tallers/css/tallers.css' %}">
{% endblock %}

{% block content %}
<div class="add-edit container mt-5">
    <h2 class="my-4  eg-font text-uppercase">Eliminar Taller</h2>
    <p class="">Seguro que quieres eliminar permanentemente el taller <strong>{{ taller.name }}</strong>?</p>
    
    <form method="POST" action="{% url 'tallers:delete_taller' taller.id %}">
        {% csrf_token %}
        <button type="submit" name="confirm_delete" class="btn btn-danger rounded-pill">Eliminar Taller</button>
        <button type="submit" name="cancel_delete" class="btn btn-custom btn-success rounded-pill ml-4">Guardar Taller</button>
    </form>
</div>
{% endblock %}
