{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'shows/css/shows.css' %}">
{% endblock %}

{% block content %}
<div class="add-edit container mt-5">
    <h2 class="my-4 text-uppercase">Eliminar Evento</h2>
    <p class="">Seguro que quieres eliminar permanentemente el evento <strong>{{ show.name }}</strong>?</p>
    
    <form method="POST" action="{% url 'shows:delete_show' show.id %}">
        {% csrf_token %}
        <button type="submit" name="confirm_delete" class="btn btn-danger rounded-pill">Eliminar</button>
        <button type="submit" name="cancel_delete" class="btn btn-custom btn-success rounded-pill ml-4">Guardar Evento</button>
    </form>
</div>
{% endblock %}
